# Vanilla Together for Fabric 26.3: the mods and the packs each belongs to.
# side:  server = the server only, client = player packs only,
#        both = everywhere. Libraries are not listed: build.py adds every
#        required dependency of a listed mod and gives it the same packs.
# packs: "full" holds everything; "essential" is what a player needs to join
#        and talk (voice chat, ping wheel) plus the performance mods.
#        A server runs the server side of "full".
# version: optional, a Modrinth version number that pins the mod. Without it
#        build.py --update takes the newest version. Pin only with a note
#        that says why and when the pin can go.

[pack]
name = "Vanilla Together"
version = "1.0.1"
summary = "Vanilla Minecraft, just smoother: performance, maps, claims and proximity voice chat on Fabric 26.3"
minecraft = "26.3"
fabric_loader = "0.20.1"

